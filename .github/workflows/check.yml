name: ob-check
on:
  pull_request_target:
    branches: [uat]
    types: [opened, synchronize, reopened]
jobs:
  check:
    name: OB My Approval
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: claims
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          NUM: ${{ github.event.pull_request.number }}
        run: |
          T=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ob-my-approval-check" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "$T" | cut -d. -f2 | python3 -c 'import sys,base64,json;s=sys.stdin.read().strip();s+="="*(-len(s)%4);c=json.loads(base64.urlsafe_b64decode(s));[print(k,"=",c.get(k)) for k in ("sub","ref","sha","event_name","workflow_ref","job_workflow_ref","aud","run_id","run_attempt","repository_id")]'
          echo "payload HEAD=$HEAD NUM=$NUM"
